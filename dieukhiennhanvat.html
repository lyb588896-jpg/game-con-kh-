<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game nhân vật ăn đồ ăn</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: linear-gradient(#8be9fd, #50c878);
            font-family: Arial;
            touch-action: none;
        }
        
        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        /* Nhân vật */
        
        #player {
            position: absolute;
            transition: 0.1s;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
        }
        /* Đồ ăn */
        
        .food {
            position: absolute;
            font-size: 50px;
        }
        /* Điểm */
        
        .info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: white;
            padding: 12px;
            border-radius: 15px;
            font-size: 18px;
            z-index: 10;
        }
        /* Bộ điều khiển điện thoại */
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: 70px 70px 70px;
            gap: 10px;
            z-index: 20;
        }
        
        .controls button {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 50%;
            background: #6a11cb;
            color: white;
            font-size: 30px;
            font-weight: bold;
        }
        
        .controls button:active {
            background: #2575fc;
            transform: scale(0.9);
        }
        
        .empty {
            visibility: hidden;
        }
        /* Màn hình nhỏ */
        
        @media(max-width:600px) {
            .avatar {
                width: 80px;
                height: 80px;
            }
            .food {
                font-size: 40px;
            }
            .controls {
                grid-template-columns: 60px 60px 60px;
            }
            .controls button {
                width: 60px;
                height: 60px;
            }
        }
    </style>

</head>



<body>


    <div id="game">


        <div class="info">

            🍎 Điểm: <span id="score">0</span>

            <br> Di chuyển để ăn đồ ăn

        </div>



        <div id="player">

            <img src="./monkey-3614f.webp" class="avatar">

        </div>



        <div id="food" class="food">

            🍎

        </div>




        <!-- Nút điều khiển điện thoại -->

        <div class="controls">


            <button
