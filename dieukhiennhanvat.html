<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game nhân vật ăn đồ ăn</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: linear-gradient(#8be9fd, #50c878);
            font-family: Arial;
            touch-action: none;
        }
        
        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        /* Nhân vật */
        
        #player {
            position: absolute;
            left: 100px;
            top: 100px;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            transition: 0.2s;
        }
        /* Hiệu ứng ăn */
        
        .eat-effect {
            animation: eat 0.35s;
            box-shadow: 0 0 20px yellow, 0 0 40px orange;
        }
        
        @keyframes eat {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.35) rotate(10deg);
            }
            60% {
                transform: scale(1.15) rotate(-10deg);
            }
            100% {
                transform: scale(1);
            }
        }
        /* Đồ ăn */
        
        .food {
            position: absolute;
            font-size: 50px;
            animation: bounce .8s infinite alternate;
        }
        
        @keyframes bounce {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.2);
            }
        }
        /* Điểm */
        
        .info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: white;
            padding: 12px;
            border-radius: 15px;
            font-size: 18px;
            z-index: 10;
        }
        /* Điều khiển */
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: 70px 70px 70px;
            gap: 10px;
            z-index: 20;
        }
        
        .controls button {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 50%;
            background: #6a11cb;
            color: white;
            font-size: 30px;
        }
        
        .controls button:active {
            background: #2575fc;
            transform: scale(.9);
        }
        
        .empty {
            visibility: hidden;
        }
        
        @media(max-width:600px) {
            .avatar {
                width: 80px;
                height: 80px;
            }
            .food {
                font-size: 40px;
            }
            .controls button {
                width: 60px;
                height: 60px;
            }
            .controls {
                grid-template-columns: 60px 60px 60px;
            }
        }
    </style>


</head>



<body>


    <div id="game">



        <div class="info">

            🍎 Điểm:
            <span id="score">0</span>

            <br> 📏 Kích thước:
            <span id="sizeText">100</span>

            <br> Di chuyển ăn táo

        </div>




        <div id="player">

            <img class="avatar" src="monkey-3614f.webp">

        </div>





        <div id="food" class="food">

            🍎

        </div>





        <div class="controls">


            <div class="empty"></div>

            <button id="up">⬆️</button>

            <div class="empty"></div>


            <button id="left">⬅️</button>

            <button id="down">⬇️</button>

            <button id="right">➡️</button>


        </div>


    </div>







    <script>
        const player =
            document.getElementById("player");


        const avatar =
            document.querySelector(".avatar");


        const food =
            document.getElementById("food");


        const scoreText =
            document.getElementById("score");


        const sizeText =
            document.getElementById("sizeText");




        let x = 100;

        let y = 100;


        let speed = 5;


        let score = 0;


        let playerSize = 100;


        let maxSize = 250;



        let keys = {

            up: false,

            down: false,

            left: false,

            right: false

        };






        function randomFood() {


            food.style.left =
                Math.random() * (window.innerWidth - 60) + "px";


            food.style.top =
                Math.random() * (window.innerHeight - 60) + "px";


        }



        randomFood();








        function game() {



            if (keys.up)
                y -= speed;


            if (keys.down)
                y += speed;


            if (keys.left)
                x -= speed;


            if (keys.right)
                x += speed;





            x = Math.max(
                0,
                Math.min(window.innerWidth - playerSize, x)
            );


            y = Math.max(
                0,
                Math.min(window.innerHeight - playerSize, y)
            );





            player.style.left = x + "px";

            player.style.top = y + "px";







            let dx =
                x - food.offsetLeft;


            let dy =
                y - food.offsetTop;



            let distance =
                Math.sqrt(dx * dx + dy * dy);







            if (distance < playerSize / 2 + 40) {


                score++;


                scoreText.innerHTML = score;



                // tăng kích thước

                if (playerSize < maxSize) {

                    playerSize += 10;

                }



                avatar.style.width =
                    playerSize + "px";


                avatar.style.height =
                    playerSize + "px";



                sizeText.innerHTML =
                    playerSize;





                // hiệu ứng ăn

                avatar.classList.remove("eat-effect");


                void avatar.offsetWidth;


                avatar.classList.add("eat-effect");





                // tăng tốc nhẹ

                speed += 0.1;



                randomFood();



            }





            requestAnimationFrame(game);



        }



        game();







        // PC điều khiển


        document.addEventListener("keydown", e => {


            let k = e.key.toLowerCase();


            if (k == "w" || k == "arrowup")
                keys.up = true;


            if (k == "s" || k == "arrowdown")
                keys.down = true;


            if (k == "a" || k == "arrowleft")
                keys.left = true;


            if (k == "d" || k == "arrowright")
                keys.right = true;


        });





        document.addEventListener("keyup", e => {


            let k = e.key.toLowerCase();


            if (k == "w" || k == "arrowup")
                keys.up = false;


            if (k == "s" || k == "arrowdown")
                keys.down = false;


            if (k == "a" || k == "arrowleft")
                keys.left = false;


            if (k == "d" || k == "arrowright")
                keys.right = false;


        });








        // nút điện thoại


        function control(id, dir) {


            let btn = document.getElementById(id);



            btn.addEventListener("touchstart", e => {


                e.preventDefault();


                keys[dir] = true;


            });



            btn.addEventListener("touchend", () => {


                keys[dir] = false;


            });



            btn.addEventListener("mousedown", () => {


                keys[dir] = true;


            });



            btn.addEventListener("mouseup", () => {


                keys[dir] = false;


            });


            btn.addEventListener("mouseleave", () => {


                keys[dir] = false;


            });


        }





        control("up", "up");

        control("down", "down");

        control("left", "left");

        control("right", "right");
    </script>



</body>

</html>
